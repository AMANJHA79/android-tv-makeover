name: Build Live TV APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - run: chmod +x build_live_tv.sh && ./build_live_tv.sh
      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-apk
          path: apps/live-tv/build/app/outputs/flutter-apk/*.apk
